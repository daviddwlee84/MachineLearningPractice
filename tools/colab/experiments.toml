# Experiment manifest for running Algorithm/ scripts on a Colab VM.
#
# Fields
#   script       path from the repo root (scripts read `Datasets/...` relative to the root)
#   data         files under the repo root this script reads (shipped in the upload tarball)
#   pip          extra requirements on top of Colab's preinstalled stack
#   tier         A: seconds, B: minutes, C: long-running (only follow-ups today), D: optional / fragile deps
#   runtime      recommended Colab shape: cpu | cpu-highmem | T4 | L4 | A100
#   timeout_min  hard limit on the VM (the runner kills the script after this)
#   est_min      wall minutes measured on a standard Colab CPU VM (2 vCPU, 12.7 GB), 2026-11
#   status       ready | optional | followup  (followup = not runnable yet, see `note`)
#
# `tools/colab/run_experiments.py --estimate` turns this into a time / compute-unit table.

[defaults]
runtime = "cpu"
timeout_min = 10
status = "ready"

